<!-- templates/contacts/property_form.html -->
{% extends 'contacts/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Property for {{ contact.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary mt-3">{% if form.instance.pk %}Update{% else %}Add{% endif %} Property</button>
        <a href="{% url 'contact_detail' contact.id %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
{% endblock %}

{% block javascript %}
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_api_key }}&libraries=places"></script>
<script>
    function initAutocomplete() {
        var addressInput = document.getElementById('id_address');
        var autocomplete = new google.maps.places.Autocomplete(addressInput);
        autocomplete.setFields(['address_components', 'geometry', 'icon', 'name']);

        autocomplete.addListener('place_changed', function() {
            var place = autocomplete.getPlace();
            console.log(place);
            // Extract the address components if needed
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        initAutocomplete();
    });
</script>

{% endblock %}
