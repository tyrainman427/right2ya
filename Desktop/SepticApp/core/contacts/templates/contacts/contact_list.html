{% extends 'contacts/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Contact List</h2>
    <div class="d-flex justify-content-end mb-3">
        <!-- Button to add new contact -->
        <a href="{% url 'create_contact' %}" class="btn btn-primary">Add Contact</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover table-sm">
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>
                        <!-- Clickable header for sorting by name -->
                        <a href="{% url 'contact_list' %}?sort=name">Name</a>
                    </th>
                    <th>
                        <!-- Clickable header for sorting by type -->
                        <a href="{% url 'contact_list' %}?sort=type">Type</a>
                    </th>
                    <th>
                        <!-- Clickable header for sorting by address -->
                        <a href="{% url 'contact_list' %}?sort=address">Address</a>
                    </th>
                    <!-- Add more clickable headers as needed -->
                </tr>
            </thead>
            <tbody>
                {% for contact in contacts %}
                <tr>
                    <td><input type="checkbox" name="selectedContact" value="{{ contact.id }}"></td>
                    <td><a href="{% url 'contact_detail' contact.id %}">{{ contact.name }}</a></td>
                    <td><a href="{% url 'contact_detail' contact.id %}">{{ contact.contact_type }}</a></td>
                    <td><a href="{% url 'contact_detail' contact.id %}">{{ contact.address }}</a></td>
                    <!-- Add more contact details as needed -->
                </tr>
                {% empty %}
                <tr><td colspan="8">No contacts available.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JavaScript Bundle with Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // JavaScript for 'Select All' functionality
    document.getElementById('selectAll').addEventListener('click', function(e) {
        var checkboxes = document.getElementsByName('selectedContact');
        for (var checkbox of checkboxes) {
            checkbox.checked = this.checked;
        }
    });
</script>
{% endblock %}
