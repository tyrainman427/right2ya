{% extends 'contacts/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Work Orders</h2>
        <a href="{% url 'create_work_order' %}" class="btn btn-primary">Add New Job</a>
    </div>

    <!-- Card for Work Orders -->
    <div class="card">
        <div class="card-body">
            {% if orders %}
            <table class="table">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Contact</th>
                        <th>Property</th>
                        <!-- Other headers as needed -->
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr class='clickable-row' data-href='{% url "work_order_detail" order.id %}'>
                        <td>{{ order.work_order_number }}</td>
                        <td>{{ order.contact }}</td>
                        <td>{{ order.property }}</td>
                        <!-- Other details as needed -->
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p>No current jobs.</p>
            {% endif %}
        </div>
    </div>
</div>

<script>
    // JavaScript to make table rows clickable
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".clickable-row").forEach(row => {
            row.addEventListener("click", () => {
                window.location.href = row.dataset.href;
            });
        });
    });
</script>

{% endblock %}
